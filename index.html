<style>
:root{
  --bg:#0a0d0b;--card:#121712;--text:#eafff2;--muted:#8fa89b;--primary:#22c55e;--primary-dk:#16a34a;
  --lav:#132419;--border:#1f2e24;--danger:#f87171;--ok:#22c55e;--warn:#facc15;--r:16px;
  --glow:0 0 18px rgba(34,197,94,.28);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#f3f7f4;--card:#ffffff;--text:#0b1410;--muted:#57685e;--lav:#e6f6ec;--border:#dde8e1;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 15% 0%,rgba(34,197,94,.08),transparent 40%);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;min-height:100%;}
h1,h2,h3{font-family:inherit;letter-spacing:-.02em}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--primary);color:#04140a;border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;transition:all .15s;box-shadow:var(--glow)}
.btn:hover{background:#4ade80;box-shadow:0 0 26px rgba(34,197,94,.45)}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;transition:border-color .15s}
.card:hover{border-color:#2c4636}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:10px 0 4px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--lav);color:var(--primary)}
.bar-bg{background:var(--lav);border-radius:8px;height:10px;overflow:hidden;margin:6px 0}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--primary-dk),var(--primary));border-radius:8px;box-shadow:0 0 8px rgba(34,197,94,.5)}
#app{display:flex;min-height:100vh}
.sidebar{width:230px;flex:none;background:var(--card);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar.hide{display:none}
.brand{font-weight:800;font-size:19px;padding:6px 10px 18px;color:var(--primary-dk)}
.navlink{display:block;padding:10px 12px;border-radius:10px;color:var(--text);font-size:14px;font-weight:500;margin-bottom:2px}
.navlink.active,.navlink:hover{background:var(--lav);color:var(--primary-dk)}
.main{flex:1;min-width:0;padding:20px clamp(16px,4vw,40px);max-width:1100px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.mobile-toggle{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
@media(max-width:820px){.sidebar{position:fixed;z-index:20;box-shadow:0 0 30px rgba(0,0,0,.2)}.mobile-toggle{display:block}.main{width:100%}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;text-align:left;border-bottom:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(3,8,5,.72);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:30px 14px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:680px;width:100%;padding:24px;margin-top:10px}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
.notice{background:var(--lav);border-left:4px solid var(--primary);padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:10px}
.chatbox{height:400px;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--bg)}
.msg{max-width:80%;padding:9px 13px;border-radius:14px;margin-bottom:8px;font-size:14px;white-space:pre-wrap}
.msg.user{background:var(--primary);color:#04140a;margin-left:auto;border-bottom-right-radius:3px;font-weight:600}
.msg.ai{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);padding:4px;font-size:12px;cursor:pointer;position:relative}
.cal-cell.today{border-color:var(--primary);border-width:2px}
.cal-cell.sel{background:var(--lav)}
.cal-cell{aspect-ratio:auto;min-height:84px;overflow:hidden;padding:3px}
.chip{background:var(--lav);color:var(--primary);border-left:3px solid var(--primary);border-radius:5px;font-size:10px;line-height:1.2;padding:2px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.more{font-size:10px;color:var(--muted);margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--primary);position:absolute;bottom:4px;left:4px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.b-late{background:rgba(248,113,113,.15);color:var(--danger)}.b-soon{background:rgba(250,204,21,.15);color:var(--warn)}.b-ok{background:rgba(34,197,94,.15);color:var(--ok)}
.hero{text-align:center;padding:70px 16px 40px}
.feat{cursor:default}
.glow-text{text-shadow:0 0 24px rgba(34,197,94,.5)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
</style>
</head>

// ---------- helpers ----------
function engPct(lvl){return {A1:20,A2:35,B1:50,B2:65,C1:80,C2:95}[lvl]||50;}
function skillGap(p){
  return [
    {k:'GPA',v:Math.min(100,Math.round((parseFloat(p.gpa)||0)/4*100))},
    {k:'Английский',v:engPct(p.english)},
    {k:'Программирование',v:Math.min(100,(+p.programmingCount||0)*20)},
    {k:'Математика',v:Math.min(100,+p.mathScore||0)},
    {k:'Проекты',v:Math.min(100,(+p.projectsCount||0)*25)},
    {k:'Исследования',v:Math.min(100,(+p.researchCount||0)*50)},
    {k:'Олимпиады',v:Math.min(100,(+p.olympiadsCount||0)*30)},
    {k:'Лидерство',v:Math.min(100,(+p.leadershipCount||0)*30)},
    {k:'Волонтёрство',v:Math.min(100,(+p.volunteeringCount||0)*25)},
  ];
}
function gapAdvice(sg,major){
  const notes=[];
  sg.forEach(s=>{
    if(s.v<40){
      if(s.k=='Исследования')notes.push('Для выбранной специальности желательно усилить исследовательский опыт — попробуй профильный research-проект.');
      if(s.k=='Проекты')notes.push('У тебя мало профильных проектов по направлению «'+major+'» — стоит запустить хотя бы один.');
      if(s.k=='Олимпиады')notes.push('Тебе не хватает олимпиад/конкурсов в профильной области.');
      if(s.k=='GPA')notes.push('Стоит подтянуть GPA — это важный критерий для большинства университетов.');
      if(s.k=='Английский')notes.push('Для многих зарубежных университетов нужен более высокий уровень английского.');
      if(s.k=='Программирование')notes.push('Стоит прокачать программирование — например, через личный проект или курс.');
      if(s.k=='Математика')notes.push('Математическая база пока слабовата для «'+major+'» — уделяй ей больше времени.');
      if(s.k=='Лидерство')notes.push('Добавь опыт лидерства — например, руководство школьным проектом или клубом.');
      if(s.k=='Волонтёрство')notes.push('Волонтёрский опыт усилит портфолио — рассмотри локальные инициативы.');
    }
  });
  return notes.length?notes:['Твой профиль сбалансирован — продолжай развивать текущие направления.'];
}
function matchUni(uni,p){
  const checks=[
    {label:'GPA',pass:(parseFloat(p.gpa)||0)>=uni.gpaMin,detail:`Твой GPA ${p.gpa||'—'}, нужно от ${uni.gpaMin}`},
    {label:'Английский',pass:engPct(p.english)>=uni.engPct,detail:`Твой уровень ${p.english}, ориентир — ${uni.english}`},
    {label:'Профильные проекты',pass:(+p.projectsCount||0)>=1,detail:`У тебя ${p.projectsCount||0} проектов`},
    {label:'Олимпиады/конкурсы',pass:(+p.olympiadsCount||0)>=1,detail:`У тебя ${p.olympiadsCount||0}`},
    {label:'Исследовательский опыт',pass:(+p.researchCount||0)>=1,detail:`У тебя ${p.researchCount||0}`},
  ];
  const passed=checks.filter(c=>c.pass).length;
  return {pct:Math.round(passed/checks.length*100),checks};
}
function daysLeft(dateStr){const d=new Date(dateStr+'T00:00:00');const t=new Date(todayISO()+'T00:00:00');return Math.round((d-t)/86400000);}
function deadlineBadge(dl){
  if(!dl||dl==='Без дедлайна')return '';
  let iso=dl.length===10&&dl.includes('-')?dl:null;
  if(!iso)return `<span class="badge b-ok">${dl}</span>`;
  const d=daysLeft(iso);
  if(d<0)return `<span class="badge b-late">Просрочено</span>`;
  if(d===0)return `<span class="badge b-late">Дедлайн сегодня</span>`;
  if(d===1)return `<span class="badge b-soon">Дедлайн завтра</span>`;
  if(d<=3)return `<span class="badge b-soon">Осталось ${d} дня</span>`;
  if(d<=10)return `<span class="badge b-soon">Осталось ${d} дней</span>`;
  return `<span class="badge b-ok">${iso}</span>`;
}

function analyzeEssay(t){
  const wc=t.trim().split(/\s+/).filter(Boolean).length;
  const pros=[],cons=[];
  if(wc>250)pros.push('Хороший объём текста'); else cons.push('Текст короткий — добавь больше конкретных деталей');
  if(/потому что|так как|because/i.test(t))pros.push('Есть аргументация и объяснение причин'); else cons.push('Не хватает объяснения «почему» — покажи причины своих решений');
  if(/университет|university|программ/i.test(t))pros.push('Есть упоминание университета/программы'); else cons.push('Не хватает объяснения, почему выбран именно этот университет');
  if(/карьер|career|будущ/i.test(t))pros.push('Есть связь с будущей карьерой'); else cons.push('Добавь, как это связано с твоими будущими планами');
  if(/например|for example|в частности/i.test(t))pros.push('Есть конкретные примеры'); else cons.push('Слишком общие формулировки — добавь конкретные примеры и цифры');
  return {wc,pros,cons};
}
function checkDoc(t){
  const res=[];
  const has=(re,label)=>res.push({label,ok:re.test(t)});
  has(/[a-zа-яё]+\s+[a-zа-яё]+/i,'Указано имя (ФИО)');
  has(/\d{4}/,'Указан год/дата');
  has(/gpa|балл|оценк/i,'Есть информация об оценках/GPA');
  has(/@/,'Указан email');
  has(/школ|university|университет|college/i,'Указано учебное заведение');
  return res;
}

let AI=null, AI_STATE='checking'; // 'checking' | 'ready' | 'unavailable'
(function initAI(){
  // Standalone: AI идёт через твой сервер /api/claude -> Claude API (ключ хранится на сервере)
  async function call(messages,json){
    const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,json})});
    if(!r.ok){const e=new Error('ai_error');e.code=r.status===429?'rate_limited':'error';throw e;}
    return (await r.json()).text||'';
  }
  AI=async function(input,opts){
    const messages=typeof input==='string'?[{role:'user',content:input}]:input;
    const text=await call(messages,false);
    if(opts&&opts.onText)opts.onText({text});
    return {text};
  };
  AI.json=async function(prompt){
    const t=await call([{role:'user',content:prompt}],true);
    return JSON.parse(t.replace(/```json|```/g,'').trim());
  };
  AI_STATE='ready';
  if(currentView()==='assistant') renderAssistant();
})();

  ['name','surname','age','country','city','school','grade','gpa','major','countries','languages','english','github','olympiadsCount','projectsCount','competitionsCount','volunteeringCount','internshipsCount','certificatesCount','researchCount','leadershipCount','programmingCount','mathScore','achievements'].forEach(k=>{

let uniFilter={q:'',country:'',major:''};
function renderUniversities(){
  const list=UNIS.filter(u=> (!uniFilter.q||u.name.toLowerCase().includes(uniFilter.q.toLowerCase()))
    && (!uniFilter.country||u.country===uniFilter.country)
    && (!uniFilter.major||u.majors.includes(uniFilter.major)));
  layout(`
  <h2>Universities</h2>
  <p class="notice">Демо-база данных университетов. Требования и дедлайны — примерные, для реального использования подключите официальные источники.</p>

    <select onchange="uniFilter.country=this.value;renderUniversities()"><option value="">Все страны</option>${[...new Set(UNIS.map(u=>u.country))].map(c=>`<option ${uniFilter.country===c?'selected':''}>${c}</option>`).join('')}</select>
    <select onchange="uniFilter.major=this.value;renderUniversities()"><option value="">Все специальности</option>${[...new Set(UNIS.flatMap(u=>u.majors))].sort().map(m=>`<option ${uniFilter.major===m?'selected':''}>${m}</option>`).join('')}</select>
  </div>

      <div class="row" style="justify-content:space-between"><b>${u.name}</b><span onclick="toggleSave('uni','${u.id}')" style="cursor:pointer">${sav?'❤️':'♡'}</span></div>
      <div class="muted">${u.city}, ${u.country}</div>
      <div class="pill" style="margin:8px 0">Match: ${m.pct}%</div>

function toggleSave(type,id){
  const arr=state.saved[type]; const i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1); else arr.push(id);
  save(); render();
}
function openUni(id){
  const u=UNIS.find(x=>x.id===id); const m=matchUni(u,state.profile); const sg=skillGap(state.profile);
  document.getElementById('uniModalHolder').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <h2 style="margin-top:0">${u.name}</h2>
      <div class="muted">${u.city}, ${u.country}</div>
      <p><b>Специальности:</b> ${u.majors.join(', ')}</p>

}
function addApplication(uniId){
  const u=UNIS.find(x=>x.id===uniId);

}

function oppApps(){try{return JSON.parse(localStorage.getItem('fm_oppapps'))||[];}catch(e){return [];}}
function applyOpp(id){
  const o=OPPS.find(x=>x.id===id);const old=oppApps().find(a=>a.oppId===id);const p=state.profile;
  let h=document.getElementById('applyHolder');if(!h){h=document.createElement('div');h.id='applyHolder';document.body.appendChild(h);}
  h.innerHTML=`<div class="overlay" style="z-index:60" onclick="if(event.target===this)this.remove()"><div class="modal">
    <h2 style="margin-top:0">Заявка: ${o.title}</h2><p class="muted">${o.org} · ${o.country} · ${o.mode} · дедлайн ${o.deadline}</p>
    ${old?`<div class="notice">✓ Ты уже подал(а) заявку ${old.date}. Можно отправить обновлённую.</div>`:''}
    <form onsubmit="submitOpp(event,'${id}')">
      <label>Имя и фамилия</label><input id="ap_name" required value="${((p.name||'')+' '+(p.surname||'')).trim()}">
      <label>Email</label><input id="ap_email" type="email" required value="${(state.user&&state.user.email)||''}">
      <label>Телефон / Telegram</label><input id="ap_phone">
      <label>Почему ты хочешь участвовать?</label><textarea id="ap_text" rows="5" required>${old?old.text:''}</textarea>
      <div class="check"><input type="checkbox" required style="width:auto"> Подтверждаю, что данные верны</div>
      <div class="row" style="margin-top:12px"><button class="btn sm" type="submit">Отправить заявку</button><button type="button" class="btn ghost sm" onclick="this.closest('.overlay').remove()">Отмена</button></div>
    </form></div></div>`;
}
function submitOpp(e,id){
  e.preventDefault();const l=oppApps().filter(a=>a.oppId!==id);
  l.push({id:uid(),oppId:id,name:ap_name.value,email:ap_email.value,phone:ap_phone.value,text:ap_text.value,date:todayISO(),status:'Отправлена'});
  try{localStorage.setItem('fm_oppapps',JSON.stringify(l));}catch(x){}
  document.getElementById('applyHolder').innerHTML='';alert('Заявка отправлена!');openOpp(id);
}

function addOppToCalendar(id){
  const o=OPPS.find(x=>x.id===id);
  const date=(o.deadline.length===10&&o.deadline.includes('-'))?o.deadline:todayISO();
  if(state.events.some(e=>e.oppId===id)){alert('Уже в календаре');return;}
  state.events.push({id:uid(),oppId:id,title:o.title,date,time:'',desc:o.desc,category:o.cat,link:o.link,priority:'Средний',status:'Запланировано'});
  save(); alert('Добавлено в календарь!');
}

// ---- CALENDAR ----
function calEvents(iso){
  const r=state.events.filter(e=>e.date===iso);
  state.saved.opp.forEach(id=>{const o=OPPS.find(x=>x.id===id);if(o&&o.deadline===iso&&!r.some(e=>e.oppId===id))r.push({id:'v'+id,title:o.title,category:o.cat,oppId:id,virtual:true,date:iso});});
  return r;
}
function renderCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7; const days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=calEvents(iso);
    const isToday=iso===todayISO(); const isSel=iso===calSelDate;
    cells+=`<div class="cal-cell ${isToday?'today':''} ${isSel?'sel':''}" onclick="calSelDate='${iso}';render()"><b>${d}</b>${evs.slice(0,2).map(e=>`<div class="chip" title="${e.title}" onclick="event.stopPropagation();calSelDate='${iso}';${e.oppId?`openOpp('${e.oppId}')`:'render()'}">${e.title}</div>`).join('')}${evs.length>2?`<div class="more">+${evs.length-2} ещё</div>`:''}</div>`;
  }
  const dayEvents=state.events.filter(e=>e.date===calSelDate);
  layout(`
  <h2>Calendar</h2>
  <div class="grid g2">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost sm" onclick="calMonth=new Date(${y},${m-1},1);render()">←</button>
        <b>${calMonth.toLocaleString('ru',{month:'long',year:'numeric'})}</b>
        <button class="btn ghost sm" onclick="calMonth=new Date(${y},${m+1},1);render()">→</button>
      </div>
      <div class="cal-grid" style="margin-top:10px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<div class="muted" style="text-align:center;font-size:11px">${d}</div>`).join('')}${cells}</div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">${calSelDate?calSelDate:'Выбери день'}</h3>
      ${calSelDate?`
      ${dayEvents.map(e=>`<div style="border-bottom:1px solid var(--border);padding:6px 0">
        <b>${e.title}</b> <span class="pill">${e.category}</span><br>
        <span class="muted" style="font-size:12.5px">${e.desc||''}</span><br>
        ${e.oppId?`<button class="btn sm" onclick="openOpp('${e.oppId}')">Открыть / Apply</button><br>`:''}
        <select onchange="updateEventStatus('${e.id}',this.value)" style="margin-top:4px;width:auto;display:inline-block">
          ${['Запланировано','В процессе','Завершено','Просрочено'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn ghost sm" onclick="delEvent('${e.id}')">Удалить</button>
      </div>`).join('')}
      ${calEvents(calSelDate).filter(e=>e.virtual).map(e=>`<div style="border-bottom:1px solid var(--border);padding:6px 0"><b>${e.title}</b> <span class="pill">${e.category}</span> <span class="muted">дедлайн (избранное)</span><br><button class="btn sm" style="margin-top:4px" onclick="openOpp('${e.oppId}')">Открыть / Apply</button></div>`).join('')}
      <form onsubmit="addEvent(event)" style="margin-top:10px">
        <label>Название</label><input id="ev_title" required>
        <label>Категория</label><select id="ev_cat">${['Дедлайн университета','Олимпиада','Экзамен','IELTS/TOEFL','SAT','Стажировка','Собеседование','Другое'].map(c=>`<option>${c}</option>`).join('')}</select>
        <label>Время</label><input id="ev_time" type="time">
        <label>Приоритет</label><select id="ev_pri"><option>Высокий</option><option selected>Средний</option><option>Низкий</option></select>
        <label>Описание</label><textarea id="ev_desc" rows="2"></textarea>
        <button class="btn sm" style="margin-top:8px" type="submit">Добавить событие</button>
      </form>`:'<p class="muted">Выбери день в календаре, чтобы добавить событие.</p>'}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <h3 style="margin-top:0">Ближайшие дедлайны</h3>
    ${upcomingEvents().map(e=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border);padding:6px 0"><span>${e.title} <span class="muted">(${e.date})</span></span>${deadlineBadge(e.date)}</div>`).join('')||'<p class="muted">Событий пока нет.</p>'}
  </div>`);
}
function addEvent(e){
  e.preventDefault();
  state.events.push({id:uid(),title:document.getElementById('ev_title').value,date:calSelDate,
    time:document.getElementById('ev_time').value,category:document.getElementById('ev_cat').value,
    priority:document.getElementById('ev_pri').value,desc:document.getElementById('ev_desc').value,status:'Запланировано'});
  save(); render();
}
function delEvent(id){state.events=state.events.filter(e=>e.id!==id);save();render();}
function updateEventStatus(id,val){const e=state.events.find(x=>x.id===id);if(e)e.status=val;save();render();}

  ${rm.map(r=>`<div class="card"><h3 style="margin-top:0">${r.m}</h3>${r.tasks.map(t=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--border);padding:5px 0"><span style="font-size:14px">• ${t}</span><button class="btn ghost sm" onclick="quickAddTask('${t.replace(/'/g,"\\'")}')">+ В календарь</button></div>`).join('')}</div>`).join('')}
  </div>`);
}
function quickAddTask(title){
  const d=new Date(); d.setDate(d.getDate()+14);
  state.events.push({id:uid(),title,date:d.toISOString().slice(0,10),category:'Roadmap',priority:'Средний',desc:'',status:'Запланировано'});
  save(); alert('Добавлено в календарь (через 14 дней)');
}

// ---- ESSAY ----
function renderEssay(){
  layout(`
  <h2>Essay Analyzer</h2>
  <p class="notice">${AI_STATE==='ready'?'🟢 Живой AI-анализ через Claude.':'🟡 Упрощённый demo-анализ (правила по ключевым словам).'} AI не переписывает твой текст автоматически — только показывает сильные и слабые стороны.</p>
  <div class="card">
    <label>Вставь текст эссе</label>
    <textarea id="essayTxt" rows="8"></textarea>
    <button class="btn" style="margin-top:10px" onclick="runEssay()">Анализировать</button>
  </div>
  <div id="essayResult"></div>`);
}
async function runEssay(){
  const t=document.getElementById('essayTxt').value;
  const wc=t.trim().split(/\s+/).filter(Boolean).length;
  const box=document.getElementById('essayResult');
  box.innerHTML=`<div class="card" style="margin-top:14px"><p class="muted">Анализирую...</p></div>`;
  let pros,cons,note='';
  if(AI){
    try{
      const data=await AI.json(`Ты помогаешь абитуриенту с мотивационным эссе для специальности "${state.profile.major}". Проанализируй текст ниже. Верни ТОЛЬКО JSON {"pros":["..."],"cons":["..."]} на русском, без markdown. pros — 3-5 конкретных сильных сторон текста, cons — 3-5 конкретных, дружелюбных советов по улучшению (без переписывания текста).\n\nТекст:\n"""${t}"""`);
      pros=data.pros||[]; cons=data.cons||[];
    }catch(err){ const r=analyzeEssay(t); pros=r.pros; cons=r.cons; note=aiUnavailableNote(err); }
  } else { const r=analyzeEssay(t); pros=r.pros; cons=r.cons; }
  box.innerHTML=`
  <div class="card" style="margin-top:14px">
    ${note?`<p class="notice">${note}</p>`:''}
    <p class="muted">Слов: ${wc}</p>
    <h3>Что хорошо</h3>${pros.map(p=>`<div class="check">✓ ${p}</div>`).join('')||'<p class="muted">Пока не найдено.</p>'}
    <h3>Что улучшить</h3>${cons.map(c=>`<div class="check">⚠ ${c}</div>`).join('')||'<p class="muted">Отлично, серьёзных замечаний нет!</p>'}
  </div>`;
}

}
async function runDoc(){
  const t=document.getElementById('docTxt').value;
  const box=document.getElementById('docResult');
  box.innerHTML=`<div class="card" style="margin-top:14px"><p class="muted">Проверяю...</p></div>`;
  let items,note='';
  if(AI){
    try{
      const data=await AI.json(`Проверь текст документа абитуриента (CV/транскрипт/анкета) на заполненность обязательных полей: ФИО, дата рождения, email/контакты, учебное заведение, оценки/GPA, специальность. Верни ТОЛЬКО JSON {"items":[{"label":"...","ok":true|false,"note":"..."}]} на русском, без markdown. Не утверждай подлинность документа — только заполнение полей.\n\nТекст:\n"""${t}"""`);
      items=data.items||[];
    }catch(err){ items=checkDoc(t).map(r=>({label:r.label,ok:r.ok,note:''})); note=aiUnavailableNote(err); }
  } else { items=checkDoc(t).map(r=>({label:r.label,ok:r.ok,note:''})); }
  box.innerHTML=`<div class="card" style="margin-top:14px">
  ${note?`<p class="notice">${note}</p>`:''}
  ${items.map(r=>`<div class="check">${r.ok?'✓ Проверка заполнения пройдена':'⚠ Найдена возможная ошибка'}: ${r.label}${r.note?` — <span class="muted">${r.note}</span>`:''}</div>`).join('')}

// ---- TRANSLATOR ----
function renderTranslator(){
  const langs=['English','Русский','Қазақша','Français','Deutsch','Español','Italiano','中文','日本語','한국어','العربية','Türkçe','Português'];
  layout(`
  <h2>AI Translator</h2>
  <p class="notice">${AI_STATE==='ready'?'🟢 Реальный перевод через Claude.':'🟡 Живой AI недоступен — показан demo-режим без перевода.'}</p>
  <div class="card">
    <div class="row"><div style="flex:1"><label>Откуда</label><select id="trFrom">${langs.map(l=>`<option>${l}</option>`).join('')}</select></div>
    <div style="flex:1"><label>Куда</label><select id="trTo">${langs.map((l,i)=>`<option ${i===0?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <label>Текст документа</label><textarea id="trTxt" rows="6"></textarea>
    <button class="btn" style="margin-top:10px" onclick="runTranslate()">Перевести (demo)</button>
  </div>
  <div id="trResult"></div>`);
}
async function runTranslate(){
  const from=document.getElementById('trFrom').value, to=document.getElementById('trTo').value, txt=document.getElementById('trTxt').value;
  const box=document.getElementById('trResult');
  if(!txt.trim()){box.innerHTML='<p class="muted">Вставь текст для перевода.</p>';return;}
  if(!AI){
    box.innerHTML=`<div class="card" style="margin-top:14px"><p class="notice">Живой AI недоступен в этом окне — реальный перевод сейчас невозможен.</p></div>`;
    return;
  }
  box.innerHTML=`<div class="card" style="margin-top:14px"><p class="muted">Перевожу ${from} → ${to}...</p><p id="trOut" style="white-space:pre-wrap"></p></div>`;
  const out=document.getElementById('trOut');
  try{
    const {text}=await AI(`Переведи следующий документ с языка ${from} на язык ${to}. Сохрани структуру, заголовки, даты и форматирование где возможно. Верни только перевод, без пояснений.\n\n${txt}`,
      {cache:false,onText:({text})=>{out.textContent=text;}});
    box.innerHTML=`<div class="card" style="margin-top:14px"><p style="white-space:pre-wrap">${text}</p>
    <button class="btn ghost sm" id="trDownloadBtn">Download translated document</button></div>`;
    document.getElementById('trDownloadBtn').onclick=()=>downloadText('translation_'+to+'.txt', text);
  }catch(err){
    box.innerHTML=`<div class="card" style="margin-top:14px"><p class="notice">${aiUnavailableNote(err)}</p></div>`;
  }
}
function downloadText(name,txt){
  const blob=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
}

// ---- AI ASSISTANT ----
function renderAssistant(){
  layout(`
  <h2>AI Assistant</h2>
  <p class="notice">${AI_STATE==='ready'?'🟢 Подключён живой Claude — отвечает на любые вопросы об учёбе и поступлении.':AI_STATE==='checking'?'Проверяю доступность AI...':'🟡 Живой AI сейчас недоступен в этом окне — работает упрощённый demo-режим по ключевым словам.'}</p>
  <div class="card">
    <div class="chatbox" id="chatbox">${state.chat.map(m=>`<div class="msg ${m.role}">${m.text}</div>`).join('')||'<p class="muted">Задай вопрос об университетах, грантах, IELTS, эссе...</p>'}</div>
    <form class="row" style="margin-top:10px" onsubmit="sendChat(event)">
      <input id="chatInput" placeholder="Напиши сообщение..." style="flex:1">
      <button class="btn sm" type="submit">Отправить</button>
    </form>
  </div>`);
  const cb=document.getElementById('chatbox'); if(cb)cb.scrollTop=cb.scrollHeight;
}
async function sendChat(e){
  e.preventDefault();
  const inp=document.getElementById('chatInput'); const msg=inp.value.trim(); if(!msg)return;
  state.chat.push({role:'user',text:msg}); inp.value=''; save(); renderAssistant();
  const aiMsg={role:'ai',text:'Думаю...'}; state.chat.push(aiMsg); renderAssistant();
  if(AI){
    try{
      const instruction={role:'user',content:'Ты — AI-ассистент FuturePath, помогаешь школьникам и студентам с поступлением, грантами, олимпиадами, эссе и документами. Отвечай по-русски, просто и понятно, без сложных терминов, конкретно и по делу. '+profileCtx()};
      const history=state.chat.slice(0,-1).filter(m=>m.text!=='Думаю...').map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text}));
      const turns=[instruction,...history];
      const {text}=await AI(turns,{cache:false,modelTier:'default',onText:({text})=>{aiMsg.text=text;renderAssistant();}});
      aiMsg.text=text;
    }catch(err){ aiMsg.text=aiUnavailableNote(err)+'\n\n'+chatReply(msg); }
  } else {
    aiMsg.text=chatReply(msg);
  }
  save(); renderAssistant();
}

const PORTFOLIO_CATS=['Academic','Projects','Olympiads','Competitions','Internships','Volunteering','Leadership','Research','Certificates','Awards'];
function renderPortfolio(){
  layout(`
  <h2>My Portfolio</h2>
  <p class="muted">Добавляй сюда достижения вручную — они не влияют на Skill Gap автоматически (для этого используются счётчики в профиле), но формируют твоё резюме.</p>

        <button class="btn sm" type="submit">+</button>
      </form>
    </div>`).join('')}

function addPortfolio(e,cat){
  e.preventDefault();
  const inp=document.getElementById('pfi_'+cat); const v=inp.value.trim(); if(!v)return;

  state.portfolio[cat].push(v); save(); renderPortfolio();
}
function delPortfolio(cat,i){state.portfolio[cat].splice(i,1);save();renderPortfolio();}
